[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-based-ttn-search"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "scikit-learn", "qiskit", "networkx", "matplotlib", "quimb", "pydot", "tqdm"]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
